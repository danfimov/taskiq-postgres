[project]
site_name = "taskiq-postgres"
repo_url = "https://github.com/danfimov/taskiq-postgres"
repo_name = "taskiq-postgres"
edit_uri = "edit/main/docs/"

nav = [
  { "Overview" = ["index.md"] },
  { "Tutorial" = [
    "tutorial/result_backend.md",
    "tutorial/schedule_source.md",
    "tutorial/sharing_pool.md",
    "tutorial/common_issues.md",
  ] },
  { "API" = ["reference.md"] },
  { "Contributing" = ["contributing.md"] },
]

[project.theme]
language = "ru"
favicon = "assets/favicon.svg"
features = [
  "toc.follow",
  "toc.integrate",
  "navigation.expand",
  "navigation.tabs",
  "navigation.top",
  "navigation.sections",
  "navigation.path",
  "content.action.edit",
  "content.code.annotate",
  "content.code.select",
  "content.code.copy",
  "content.tabs.link",
]

[[project.theme.palette]]
media = "(prefers-color-scheme)"
toggle.icon = "material/brightness-auto"
toggle.name = "Use light mode"

[[project.theme.palette]]
media = "(prefers-color-scheme: light)"
scheme = "default"
primary = "indigo"
accent = "blue"
toggle.icon = "material/brightness-4"
toggle.name = "Use dark mode"

[[project.theme.palette]]
media = "(prefers-color-scheme: dark)"
scheme = "slate"
primary = "indigo"
accent = "blue"
toggle.icon = "material/brightness-7"
toggle.name = "Use system colors"

[project.markdown_extensions]
toc.permalink = true
toc.slugify.kwds.case = "lower"
"pymdownx.highlight".anchor_linenums = true
"pymdownx.highlight".line_spans = "__span"
"pymdownx.highlight".pygments_lang_class = true
"pymdownx.highlight".use_pygments = true
"pymdownx.emoji".emoji_index = "zensical.extensions.emoji.twemoji"
"pymdownx.emoji".emoji_generator = "zensical.extensions.emoji.to_svg"
"pymdownx.tabbed".alternate_style = true
"pymdownx.inlinehilite" = {}
"pymdownx.snippets" = {}
"pymdownx.superfences" = {}
"pymdownx.critic" = {}
"pymdownx.caret" = {}
"pymdownx.keys" = {}
"pymdownx.mark" = {}
"pymdownx.tilde" = {}
"pymdownx.blocks.caption" = {}
tables = {}
attr_list = {}
admonition = {}
md_in_html = {}

[project.plugins]
search = {}

[project.plugins.mkdocstrings]
handlers.python.inventories = [
  { url = "https://docs.python.org/3/objects.inv", domains = ["py", "std"] },
]
handlers.python.options.docstring_style = "google"
handlers.python.options.filters = ["!^_"]
handlers.python.options.show_root_heading = true
handlers.python.options.show_if_no_docstring = true
handlers.python.options.inherited_members = true
handlers.python.options.members_order = "source"
handlers.python.options.separate_signature = true
handlers.python.options.unwrap_annotated = true
handlers.python.options.merge_init_into_class = true
handlers.python.options.docstring_section_style = "list"
handlers.python.options.signature_crossrefs = true
handlers.python.options.show_symbol_type_heading = true
handlers.python.options.show_symbol_type_toc = true
